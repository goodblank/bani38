<div class="modal-overlay" id="modal-catalog" onclick="closeModalOnBg(event, 'catalog')">
<div class="modal-box">
<button class="modal-close" onclick="closeModal('catalog')">&times;</button>
<div class="modal-media"></div>
<h2 id="cat-title" style="color:var(--graphite); margin-bottom:5px;">Название</h2>
<p style="color:var(--wood-d); font-weight:bold; font-size:1.1rem; margin-bottom: 15px;" id="cat-size">Размер</p>
<p id="cat-desc" style="margin-bottom: 24px; font-size:1.05rem; color:var(--text-light); line-height:1.6;">Описание</p>
<div id="cat-video-container"></div>

<a href="#" id="cat-btn-want" target="_blank" class="btn btn-tg btn-block" style="font-size:1.1rem; padding:18px;">Задать вопрос в Telegram</a>
<a href="tel:+79245346887" class="btn btn-outline btn-block">Позвонить и уточнить детали</a>
<a href="#contacts" class="btn btn-white btn-block" style="margin-top:15px;" onclick="closeModal('catalog');">Записаться на экскурсию в цех</a>
</div>
</div>

<div class="modal-overlay" id="modal-video" onclick="closeModalOnBg(event, 'video')">
<div class="modal-box" style="padding:15px; background:#000; max-width:800px;">
<button class="modal-close" style="top:-15px; right:-15px; background:var(--white); color:#000;" onclick="closeVideoModal()">&times;</button>
<div id="video-wrapper"></div>
</div>
</div>

<div class="modal-overlay" id="lightbox" onclick="closeLightbox(event)">
    <div class="lb-click-area lb-click-left" onclick="changeLightboxImage(-1, event)"></div>
    <div class="lb-click-area lb-click-right" onclick="changeLightboxImage(1, event)"></div>
    <button class="modal-close" style="color:#fff; background:rgba(255,255,255,.2);" onclick="closeLightbox(event)">&times;</button>
    <button class="lb-btn lb-prev" onclick="changeLightboxImage(-1, event)">&#10094;</button>
    <img id="lightbox-img" src="" alt="Full size image">
    <button class="lb-btn lb-next" onclick="changeLightboxImage(1, event)">&#10095;</button>
</div>

<script>
// --- 1. АНИМАЦИИ И СКРОЛЛ ---
document.addEventListener("DOMContentLoaded", function() {
  var observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
});

document.querySelectorAll('.js-scroll').forEach(function(anchor){
    anchor.addEventListener('click', function(e){
        e.preventDefault();
        var target = document.querySelector(this.getAttribute('href'));
        if(target) {
            var offset = 60; 
            var elementPosition = target.getBoundingClientRect().top;
            var offsetPosition = elementPosition + window.pageYOffset - offset;
            window.scrollTo({ top: offsetPosition, behavior: "smooth" });
        }
    });
});

// --- 2. ЛОГИКА КВИЗА (БЕЗ ПРЫЖКОВ И ГЛЮКОВ) ---
var quizData={step1:'', step2:[], step3:[], step4:'', step5:''};

function selectOption(el, isMultiple){
    var step = el.closest('.quiz-step');
    var value = el.getAttribute('data-value');
    if(!isMultiple){
        var s = step.querySelectorAll('.quiz-option');
        s.forEach(function(e){e.classList.remove('selected')});
        el.classList.add('selected');
        if(step.id === 'step1') quizData.step1 = value;
        if(step.id === 'step4') quizData.step4 = value;
        if(step.id === 'step5') quizData.step5 = value;
    } else {
        el.classList.toggle('selected');
        var selectedArr = [];
        var activeOptions = step.querySelectorAll('.quiz-option.selected');
        activeOptions.forEach(function(o){ selectedArr.push(o.getAttribute('data-value')); });
        if(step.id === 'step2') quizData.step2 = selectedArr;
        if(step.id === 'step3') quizData.step3 = selectedArr;
    }
}

function showStep(n){
    ['step1','step2','step3','step4','step5','step-success'].forEach(function(id){
        var el = document.getElementById(id);
        if(el) el.classList.remove('active');
    });
    var targetId = n <= 5 ? 'step'+n : 'step-success';
    var targetEl = document.getElementById(targetId);
    if(targetEl) targetEl.classList.add('active');
    
    if(n <= 5) document.getElementById('quiz-counter').innerText = 'Шаг ' + n + ' из 5';
}

function nextStep(n){ showStep(n); }
function prevStep(n){ showStep(n); }

// --- 3. БЕЗОПАСНАЯ ОТПРАВКА ЧЕРЕЗ WEB3FORMS ---
async function submitQuiz() {
    var name = document.getElementById('q-name').value;
    var phone = document.getElementById('q-phone').value;
    
    if (!name || phone.length < 5) { 
        alert('Пожалуйста, корректно заполните Имя и Телефон!'); 
        return; 
    }

    // Меняем текст кнопки, чтобы клиент видел процесс
    var btn = document.querySelector('#step5 .btn-primary');
    var originalText = btn.innerText;
    btn.innerText = 'Отправка...';
    btn.disabled = true;

    // Собираем красивое сообщение из твоего массива ответов
    var text = "🔥 НОВАЯ ЗАЯВКА С КВИЗА 🔥\n\n" + 
               "👤 Имя: " + name + "\n" + 
               "📞 Телефон: " + phone + "\n\n" + 
               "🔹 Формат: " + (quizData.step1 || 'Не выбран') + "\n" + 
               "🔹 Зоны: " + (quizData.step2.length ? quizData.step2.join(', ') : 'Не выбрано') + "\n" + 
               "🔹 Допы: " + (quizData.step3.length ? quizData.step3.join(', ') : 'Не выбрано') + "\n" + 
               "🔹 Сроки: " + (quizData.step4 || 'Не выбраны') + "\n" + 
               "🔹 Бонус: " + (quizData.step5 || 'Не выбран');

    // Настройки Web3Forms
    const formData = {
        access_key: 'b1e5ac10-27b8-4295-a83b-4f04f322291f',
        from_name: "Сайт Бани38",
        subject: `Новая заявка: ${name} (${phone})`,
        name: name,
        phone: phone,
        message: text
    };

    try {
        const response = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(formData)
        });

        if (response.ok) {
            showStep(6); // Показываем твой красивый зеленый экран успеха!
        } else {
            alert('Что-то пошло не так. Попробуйте позвонить нам напрямую.');
            btn.innerText = originalText;
            btn.disabled = false;
        }
    } catch (e) {
        alert('Ошибка сети. Проверьте интернет.');
        btn.innerText = originalText;
        btn.disabled = false;
    }
}

// --- 4. МОДАЛЬНЫЕ ОКНА И ГАЛЕРЕЯ (Без изменений) ---
function playVideo(url) {
    var wrapper = document.getElementById('video-wrapper');
    wrapper.innerHTML = '<video id="promo-vid" controls autoplay style="width:100%; max-height:80vh; border-radius:8px;"><source src="'+url+'" type="video/mp4"></video>';
    document.getElementById('modal-video').classList.add('active');
    document.getElementById('promo-vid').volume = 0.3; 
}
function closeVideoModal() {
    document.getElementById('modal-video').classList.remove('active');
    document.getElementById('video-wrapper').innerHTML = ''; 
}

var currentGallery = [];
var currentImageIndex = 0;
function openLightbox(index){
    currentImageIndex = index;
    document.getElementById('lightbox-img').src = currentGallery[currentImageIndex];
    document.getElementById('lightbox').classList.add('active');
}
function changeLightboxImage(dir, event){
    if(event) event.stopPropagation();
    currentImageIndex += dir;
    if(currentImageIndex < 0) currentImageIndex = currentGallery.length - 1;
    if(currentImageIndex >= currentGallery.length) currentImageIndex = 0;
    document.getElementById('lightbox-img').src = currentGallery[currentImageIndex];
}
function closeLightbox(e){
    if(e.target.id === 'lightbox' || e.target.classList.contains('modal-close')){
        document.getElementById('lightbox').classList.remove('active');
    }
}

function openCatalog(title, size, desc, images, video) {
    document.getElementById('cat-title').innerText = title;
    document.getElementById('cat-size').innerText = size;
    document.getElementById('cat-desc').innerText = desc;
    
    currentGallery = images || [];
    var mediaHtml = '';
    
    if(currentGallery.length > 0) {
        mediaHtml += '<div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom:20px;">';
        currentGallery.forEach(function(img, idx){
            mediaHtml += '<img src="' + img + '" style="width:100%; border-radius:8px; object-fit:cover; aspect-ratio:4/3; border:1px solid var(--border-light); cursor:zoom-in; transition:0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1" onclick="openLightbox(' + idx + ')">';
        });
        mediaHtml += '</div>';
    } else {
        mediaHtml += '<div style="width:100%; aspect-ratio:16/9; background:var(--bg-alt); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-weight:bold; margin-bottom:20px; border:2px dashed var(--border);">📸 Фотографии в обработке</div>';
    }
    document.querySelector('.modal-media').innerHTML = mediaHtml;
    
    var videoContainer = document.getElementById('cat-video-container');
    if(video) {
        videoContainer.innerHTML = '<button onclick="playVideo(\''+video+'\')" class="btn btn-block btn-video-red" style="font-size:1.1rem; padding:18px;">▶ СМОТРЕТЬ ВИДЕООБЗОР</button>';
    } else {
        videoContainer.innerHTML = '<button class="btn btn-block btn-disabled" disabled>⏳ Видеообзор монтируется</button>';
    }
    
    var tgBase = "https://t.me/Greenbook?text=";
    var wantText = "Здравствуйте, Артем! Изучил ваш сайт. Меня интересует модель: " + title + " (" + size + "). Подскажите актуальные сроки и детали.";
    document.getElementById('cat-btn-want').href = tgBase + encodeURIComponent(wantText);
    
    openModal('catalog');
}

function toggleFaq(el){var item=el.parentElement,open=item.classList.contains('open');document.querySelectorAll('.faq-item').forEach(function(f){f.classList.remove('open')});if(!open)item.classList.add('open')}
function openModal(id){document.getElementById('modal-'+id).classList.add('active');document.body.style.overflow='hidden'}
function closeModal(id){document.getElementById('modal-'+id).classList.remove('active');if(id==='catalog')document.querySelector('.modal-media').innerHTML=''; document.body.style.overflow=''}
function closeModalOnBg(e, id){ if(e.target.id === 'modal-'+id) { if(id==='video') closeVideoModal(); else closeModal(id); } }
</script>
</body>
</html>
